[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-completion"
version = "0.5.0"
description = "Evidence-based scene completion and review workbench"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-windows.lock"]}

[tool.setuptools.package-data]
"scene_completion.domain" = ["*.json", "prompts/*.md"]
"scene_completion.workflow" = ["*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dist", ".workbench", ".acceptance", ".venv", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
