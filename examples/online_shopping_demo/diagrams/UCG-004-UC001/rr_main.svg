<text x="133.0" y="549.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">api/v1/merchant/products</text>
<text x="133.0" y="567.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B"> 请求到在线商城系统，请求体包含 merchan</text>
<text x="133.0" y="585.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">tId、idempotencyKey。</text>
