<text x="133.0" y="659.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[6] 系统受理：ACT-002（商家）发送 P</text>
<text x="133.0" y="677.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">OST /api/v1/merchant/pro</text>
<text x="133.0" y="695.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">ducts 请求到在线商城系统，请求体包含 me</text>
<text x="133.0" y="713.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">rchantId、idempotencyKey。</text>
<line x1="975.0" y1="799.0" x2="125.0" y2="799.0" stroke="#27364B" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<text x="133.0" y="783.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[7] 在线商城系统校验 Authorizati</text>
<text x="133.0" y="801.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">on Token，确认商家身份。</text>
<line x1="975.0" y1="894.0" x2="125.0" y2="894.0" stroke="#27364B" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<text x="133.0" y="869.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[8] 在线商城系统校验请求参数：merchan</text>
<text x="133.0" y="887.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">tId格式合法、idempotencyKey非空</text>
<text x="133.0" y="905.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">。</text>
<line x1="975.0" y1="1000.0" x2="125.0" y2="1000.0" stroke="#27364B" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<text x="133.0" y="975.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[9] 在线商城系统调用MerchantProd</text>
<text x="133.0" y="993.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">uctService的创建商品能力，传入 mer</text>
<text x="133.0" y="1011.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">chantId、idempotencyKey。</text>
<line x1="125.0" y1="1139.0" x2="975.0" y2="1139.0" stroke="#27364B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="133.0" y="1087.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[10] MerchantProductServ</text>
<text x="133.0" y="1105.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">ice校验商家经营资质（查询 merchant </text>
<text x="133.0" y="1123.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">表，获取 merchant_id、qualifi</text>
<text x="133.0" y="1141.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">cation_status、product_pe</text>
<text x="133.0" y="1159.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">rmission），确认资质有效且有商品管理权限</text>
<text x="133.0" y="1177.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">。</text>
<line x1="975.0" y1="1311.0" x2="125.0" y2="1311.0" stroke="#27364B" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<text x="133.0" y="1259.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[10] 系统受理：MerchantProduc</text>
<text x="133.0" y="1277.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">tService校验商家经营资质（查询 merc</text>
<text x="133.0" y="1295.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">hant 表，获取 merchant_id、qu</text>
<text x="133.0" y="1313.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">alification_status、produ</text>
<text x="133.0" y="1331.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">ct_permission），确认资质有效且有商</text>
<text x="133.0" y="1349.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">品管理权限。</text>
<line x1="975.0" y1="1450.0" x2="125.0" y2="1450.0" stroke="#27364B" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<text x="133.0" y="1425.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[14] 在线商城系统向ACT-002返回 HT</text>
<text x="133.0" y="1443.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">TP 200，响应体包含 productId、s</text>
<text x="133.0" y="1461.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">tatus、version。</text>
