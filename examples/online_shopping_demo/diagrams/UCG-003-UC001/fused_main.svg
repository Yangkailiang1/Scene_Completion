<text x="188.0" y="1579.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#27364B">[13] 系统受理：OrderService 向 ACT-004（LogisticsService）登记物流单号，传入 trackingNumber、carrierCode、orderId。</text>
