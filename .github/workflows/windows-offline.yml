name: Windows offline package
on:
  workflow_dispatch:
  push:
    tags: ['scene-workbench-*']
jobs:
  package:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pip install -r requirements-windows.lock
      - run: python -m pytest -q
      - run: python tools/build_windows_bundle.py --output-dir dist
      - name: Smoke test embedded runtime
        shell: pwsh
        run: |
          & dist/scene-completion-windows-x64/python/python.exe -X utf8 -c "import deepagents,fastapi,uvicorn; print('embedded runtime OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/scene-completion-windows-x64/python/python.exe -X utf8 -m pytest dist/scene-completion-windows-x64/app/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native portable launcher and web acceptance
        run: python tools/check_windows_bundle.py dist/scene-completion-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: scene-completion-windows-x64
          path: |
            dist/scene-completion-windows-x64.zip
            dist/scene-completion-windows-x64.zip.sha256
            dist/scene-completion-windows-x64/VERSION.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/scene-completion-windows-x64.zip
            dist/scene-completion-windows-x64.zip.sha256
            dist/scene-completion-windows-x64/VERSION.json
permissions:
  contents: write
